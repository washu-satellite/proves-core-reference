name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements-docs.txt

      # The host unit tests only need googletest, which lives inside the
      # fprime submodule. Shallow-init just that path — a recursive submodule
      # update would pull the entire Zephyr tree.
      - name: Fetch googletest submodule
        run: |
          git submodule update --init --depth 1 lib/fprime
          git -C lib/fprime submodule update --init --depth 1 googletest

      # Unit-test results feed the requirements traceability matrix. A test
      # failure must not block the docs deploy — the matrix reports it as ❌.
      - name: Run unit tests for requirements matrix
        continue-on-error: true
        run: make test-unit

      - name: Generate requirements traceability matrix
        run: python3 scripts/generate_rtm.py --junit build-gtest/junit.xml --sha ${{ github.sha }}

      - name: Build MkDocs site
        run: |
          mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
